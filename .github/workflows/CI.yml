name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Project.toml declares julia = "1.10" (the LTS); test the floor and the current
        # release. The simulation golden values are pinned on the current release line.
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1'
      - uses: codecov/codecov-action@v4
        if: matrix.version == '1'
        with:
          files: lcov.info
          fail_ci_if_error: false      # coverage upload is informational
      - name: Aqua quality checks (stale deps, ambiguities, piracy, compat)
        if: matrix.version == '1'
        run: |
          julia -e 'using Pkg; Pkg.activate(temp = true); Pkg.develop(path = pwd()); Pkg.add("Aqua")
                    using Aqua, NonMarkovEvolution; Aqua.test_all(NonMarkovEvolution)'
      - name: Run the examples
        run: |
          for f in examples/*.jl; do
            echo "::group::$f"
            julia --project=. "$f"
            echo "::endgroup::"
          done

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the built site to gh-pages
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
      - name: Build, run doctests, and deploy
        env:
          # DOCUMENTER_KEY is optional; GITHUB_TOKEN is enough to push to gh-pages
          # in the same repository. Deployment is skipped on pull requests from forks.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
